[project]
name = "mlshowcase"
version = "0.1.0"
description = "Reproducible machine-learning experiments, notebooks, and results for CSC 781"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.10,<4",
    "nbclient>=0.10,<0.11",
    "nbformat>=5.10,<6",
    "numpy>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
deep-learning = [
    "torch==2.6.0",
    "torchvision==0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mlshowcase"]
